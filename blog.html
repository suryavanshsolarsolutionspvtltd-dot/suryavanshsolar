<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suryavansh Solar - Blog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml/dist/js-yaml.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

  <!-- Top Navbar -->
  <header class="bg-white border-b sticky top-0 z-50 py-4 px-6">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <a href="/" class="text-xl font-bold text-amber-600 tracking-wide">Suryavansh Solar</a>
      <a href="/blog.html" class="text-sm font-semibold text-gray-600 hover:text-amber-600">All Blogs</a>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-4xl mx-auto px-4 py-8">
    <div id="loading" class="text-center py-16 text-gray-500 font-medium">Blogs load ho rahe hain...</div>

    <!-- Blog Posts List View -->
    <div id="blog-list-view" class="hidden">
      <h1 class="text-2xl md:text-3xl font-extrabold text-gray-900 mb-6 border-b pb-4">Solar Knowledge & Updates</h1>
      <div id="posts-container" class="grid gap-6 md:grid-cols-2"></div>
    </div>

    <!-- Single Blog Post Full View -->
    <article id="blog-post-view" class="hidden bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-200">
      <a href="/blog.html" class="inline-flex items-center text-sm font-bold text-amber-600 hover:underline mb-6">
        ← Back to all blogs
      </a>
      <h1 id="post-title" class="text-2xl md:text-3xl font-bold text-gray-900 mb-3"></h1>
      <p id="post-date" class="text-xs font-semibold text-gray-400 mb-6 uppercase tracking-wider"></p>
      <div id="post-content" class="prose max-w-none text-gray-700 leading-relaxed space-y-4"></div>
    </article>
  </main>

  <script>
    const REPO_OWNER = 'suryavanshsolarsolutionspvtltd-dot';
    const REPO_NAME = 'suryavanshsolar';
    const BRANCH = 'main';

    function parseMarkdownWithMeta(raw) {
      const match = raw.match(/^---([\s\S]+?)---([\s\S]*)$/);
      if (!match) return { meta: {}, body: raw };
      try {
        return { meta: jsyaml.load(match[1]), body: match[2] };
      } catch (e) {
        return { meta: {}, body: raw };
      }
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const postSlug = params.get('post');

      try {
        if (postSlug) {
          const rawUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/content/blog/${postSlug}`;
          const res = await fetch(rawUrl);
          if (!res.ok) throw new Error("Blog post load nahi ho paya");
          const text = await res.text();
          const { meta, body } = parseMarkdownWithMeta(text);

          document.getElementById('post-title').innerText = meta.title || postSlug.replace('.md', '');
          document.getElementById('post-date').innerText = meta.date ? new Date(meta.date).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
          document.getElementById('post-content').innerHTML = marked.parse(body);

          document.getElementById('loading').classList.add('hidden');
          document.getElementById('blog-post-view').classList.remove('hidden');
        } else {
          const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/content/blog?ref=${BRANCH}`;
          const res = await fetch(apiUrl);
          const files = await res.json();

          const mdFiles = files.filter(f => f.name.endsWith('.md'));
          const container = document.getElementById('posts-container');

          for (const file of mdFiles) {
            const fileDataRes = await fetch(file.download_url);
            const fileRaw = await fileDataRes.text();
            const { meta } = parseMarkdownWithMeta(fileRaw);

            const card = document.createElement('div');
            card.className = "bg-white p-6 rounded-xl border border-gray-200 shadow-sm hover:shadow-md transition flex flex-col justify-between";
            card.innerHTML = `
              <div>
                <span class="text-xs font-semibold text-amber-600 bg-amber-50 px-2 py-1 rounded-md">UP Solar</span>
                <h2 class="text-lg font-bold text-gray-900 mt-3 mb-2 line-clamp-2">${meta.title || file.name}</h2>
                <p class="text-sm text-gray-500 line-clamp-3 mb-4">${meta.excerpt || 'Poora article padhne ke liye click karein.'}</p>
              </div>
              <a href="/blog.html?post=${encodeURIComponent(file.name)}" class="text-amber-600 font-bold text-sm hover:underline inline-flex items-center">
                Read Article →
              </a>
            `;
            container.appendChild(card);
          }

          document.getElementById('loading').classList.add('hidden');
          document.getElementById('blog-list-view').classList.remove('hidden');
        }
      } catch (err) {
        document.getElementById('loading').innerHTML = `<p class="text-red-500">Error: ${err.message}</p>`;
      }
    }

    init();
  </script>
</body>
</html>
